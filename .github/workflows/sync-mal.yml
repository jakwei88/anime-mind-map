# Anime Mind Map - pulls every ranked anime from MyAnimeList into index.html.
# Runs when you press "Run workflow" (Actions tab), and every Monday automatically.
name: Sync anime from MyAnimeList

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-mal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pull the MyAnimeList rankings into index.html
        run: |
          python3 - <<'PY'
          # Anime Mind Map: pull every ranked anime from MyAnimeList (via the free Jikan API) into index.html.
          import json, re, time, urllib.request, urllib.error, urllib.parse, sys, datetime
          FILE = "index.html"
          API = "https://api.jikan.moe/v4/top/anime?page={}"
          WAITS = [5, 10, 20, 30, 45, 60, 90, 120, 120, 120, 120, 120]

          def get(page):
              last = ""
              for i, wait in enumerate([0] + WAITS):
                  if wait:
                      print(f"  page {page}: {last} - retrying in {wait}s", flush=True)
                      time.sleep(wait)
                  try:
                      req = urllib.request.Request(API.format(page), headers={"User-Agent": "anime-mind-map-sync (GitHub Actions)"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      last = f"HTTP {e.code}"
                      if e.code != 429 and e.code < 500:
                          raise
                  except Exception as e:
                      last = str(e)
              raise RuntimeError(f"page {page} kept failing: {last}")

          def default_links(en):
              base = re.split(r" Season|:| -", en)[0].strip() or en
              q = urllib.parse.quote(base)
              free = [{"name": "Tubi", "url": "https://tubitv.com/search/" + q},
                      {"name": "Pluto TV", "url": "https://pluto.tv/search/details?query=" + q},
                      {"name": "YouTube (official channels)", "url": "https://www.youtube.com/results?search_query=" + urllib.parse.quote(en + " full episode official")}]
              paid = [{"name": "Crunchyroll", "url": "https://www.crunchyroll.com/search?q=" + q},
                      {"name": "Netflix", "url": "https://www.netflix.com/search?q=" + q}]
              return free, paid

          def main():
              html = open(FILE, encoding="utf-8").read()
              tag = '<script id="seed" type="application/json">'
              s = html.index(tag) + len(tag)
              e = html.index("</script>", s)
              seed = json.loads(html[s:e])
              idx = {str(a["id"]): a for a in seed["anime"]}
              first = get(1)
              last_page = first.get("pagination", {}).get("last_visible_page", 1)
              print(f"MyAnimeList has {last_page} pages of ranked anime", flush=True)
              names = lambda lst: [g["name"] for g in (lst or [])]
              seen, added, updated = set(), 0, 0
              page_data = first
              for page in range(1, last_page + 1):
                  if page > 1:
                      time.sleep(1.3)
                      page_data = get(page)
                  for x in page_data.get("data", []):
                      fid = str(x["mal_id"])
                      fields = {"rank": x.get("rank"), "title": x.get("title") or "", "titleEn": x.get("title_english") or x.get("title") or "",
                                "score": x.get("score"), "type": x.get("type") or "",
                                "episodes": "?" if x.get("episodes") is None else str(x["episodes"]),
                                "aired": (x.get("aired") or {}).get("string") or "",
                                "genres": names(x.get("genres")) + names(x.get("explicit_genres")),
                                "themes": names(x.get("themes")), "demographic": (names(x.get("demographics")) or [""])[0]}
                      adult = (x.get("rating") or "").startswith("Rx") or "Hentai" in fields["genres"]
                      if adult:
                          fields["adult"] = True
                      seen.add(fid)
                      a = idx.get(fid)
                      if a:
                          if a.get("edited"):          # keep your own edits; only refresh rank & score
                              a["rank"], a["score"] = fields["rank"], fields["score"]
                          else:
                              a.update(fields)
                          updated += 1
                      else:
                          if adult:
                              free, paid = [], []
                          else:
                              free, paid = default_links(fields["titleEn"])
                          a = {"id": x["mal_id"], **fields, "free": free, "paid": paid, "franchise": ""}
                          seed["anime"].append(a); idx[fid] = a; added += 1
                  if page % 25 == 0:
                      print(f"page {page}/{last_page}: {len(seed['anime'])} anime so far", flush=True)
              if len(seen) < 1000:
                  sys.exit(f"Only got {len(seen)} anime - something went wrong, so nothing was changed.")
              for a in seed["anime"]:
                  if isinstance(a.get("id"), int) and str(a["id"]) not in seen:
                      a["rank"] = None
              seed["stamp"] = "gh-" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M%S")
              seed["source"] = "https://myanimelist.net/topanime.php (synced " + datetime.datetime.now(datetime.timezone.utc).strftime("%b %d, %Y") + ")"
              out = json.dumps(seed, ensure_ascii=False, separators=(",", ":")).replace("<", "\\u003c")
              open(FILE, "w", encoding="utf-8").write(html[:s] + out + html[e:])
              print(f"Done: {added} new anime, {updated} updated, {len(seed['anime'])} total.", flush=True)

          main()
          PY

      - name: Save the updated site
        run: |
          git config user.name "anime-mind-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Sync anime from MyAnimeList"
          git push

      - name: Republish the website
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
