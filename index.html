<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f1; --ink:#2f3a36; --soft:#6b7470; --line:#2f3a36;
  --purple:#b6a3ea; --purple-d:#8e78d6; --pink:#f7a9a3; --peach:#fdd7b4; --mint:#cfe9e1; --lav:#e1d6fb; --sky:#cfe3fb; --lemon:#fbefb0;
  --card:#fff; --radius:18px; --shadow:0 3px 0 rgba(47,58,54,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{min-height:100vh;background-image:radial-gradient(#e9e2d6 1px,transparent 1px);background-size:22px 22px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.hand{font-family:"Patrick Hand",Nunito,cursive}
header{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:rgba(251,247,241,.92);backdrop-filter:blur(6px);border-bottom:2px dashed #e4dccd}
header .brand{font-family:"Patrick Hand";font-size:26px;cursor:pointer;background:var(--purple);color:#fff;padding:2px 14px;border-radius:14px;text-decoration:none}
.crumbs{font-family:"Patrick Hand";font-size:19px;color:var(--soft);flex:1;min-width:120px}
.crumbs a{text-decoration:none;color:var(--purple-d)}
.search{position:relative}
.search input{border:2px solid #e4dccd;border-radius:999px;padding:7px 14px;width:240px;background:#fff}
.search .results{position:absolute;right:0;top:110%;background:#fff;border:2px solid #e4dccd;border-radius:14px;width:320px;max-height:360px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.search .results div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0ebe2;font-size:14px}
.search .results div:hover{background:var(--lav)}
main{padding:22px 18px 60px;max-width:1280px;margin:0 auto}
.map{position:relative}
.map > svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.map > *:not(svg){position:relative;z-index:1}
.links path{fill:none;stroke:var(--line);stroke-width:2.6;stroke-linecap:round}

/* nodes */
.node{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:"Patrick Hand";font-size:20px;line-height:1.1;padding:10px 18px;border-radius:var(--radius);border:none;cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:transform .12s, box-shadow .12s;text-decoration:none;color:var(--ink)}
.node:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 6px 0 rgba(47,58,54,.14)}
.node.center{background:var(--purple);color:#fff;font-size:42px;padding:24px 34px;border-radius:26px;letter-spacing:1px;cursor:default}
.node.center:hover{transform:none}
.node.big{font-size:24px;padding:16px 22px;min-width:120px}
.node.pill{border-radius:999px}
.node.small{font-size:17px;padding:7px 14px}
.c-pink{background:var(--pink)} .c-peach{background:var(--peach)} .c-mint{background:var(--mint)} .c-lav{background:var(--lav)} .c-purple{background:var(--purple);color:#fff} .c-sky{background:var(--sky)} .c-lemon{background:var(--lemon)}
.count{font-family:Nunito;font-size:12px;font-weight:800;background:rgba(255,255,255,.75);border-radius:999px;padding:1px 7px;color:var(--ink)}

/* home layout */
.home{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:46px 60px;align-items:center;padding:20px 0}
.home .cell{display:flex;align-items:center;gap:34px}
.home .cell.l{justify-content:flex-end;flex-direction:row-reverse}
.home .cell.r{justify-content:flex-start}
.home .cell.mid{flex-direction:column;gap:22px;justify-content:center}
.home .subs{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.home .cell.l .subs{align-items:flex-end}
.home .cell.mid .subs{flex-direction:row;flex-wrap:wrap;justify-content:center}
.home .centerwrap{grid-column:2;grid-row:2;display:flex;justify-content:center}
.tagline{text-align:center;color:var(--soft);font-family:"Patrick Hand";font-size:20px;margin:0 0 6px}
@media (max-width:900px){
  .home{grid-template-columns:1fr;gap:28px}
  .home .centerwrap{grid-column:1;grid-row:1}
  .home .cell,.home .cell.l{flex-direction:row;justify-content:flex-start}
  .home .cell.l .subs{align-items:flex-start}
  .node.center{font-size:32px;padding:18px 24px}
  .search input{width:170px}
}

/* ranked tree layout */
.root-row{display:flex;justify-content:center;margin:6px 0 46px}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:40px 22px}
.tier{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.tier .leaves{display:flex;flex-direction:column;gap:8px;margin-left:24px;padding:14px 0 0 18px;border-left:2.6px solid var(--line);width:calc(100% - 24px);min-width:0}
.tier .leaf{position:relative}
.tier .leaf::before{content:"";position:absolute;left:-20px;top:50%;width:18px;border-top:2.6px solid var(--line)}
.tier .leaf:last-child::after{content:"";position:absolute;left:-22px;top:calc(50% + 2px);bottom:-4px;width:4px;background:var(--bg)}
.leaf{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:7px 10px 7px 7px;box-shadow:var(--shadow);cursor:pointer;font-size:14px;border:2px solid transparent;transition:transform .1s}
.leaf:hover{transform:translateX(3px);border-color:var(--purple)}
.leaf .rk{font-family:"Patrick Hand";font-size:18px;min-width:38px;text-align:center;border-radius:10px;padding:2px 4px;background:var(--lav)}
.leaf .t{flex:1;min-width:0;line-height:1.2}
.leaf .t b{display:block;font-weight:700;font-size:13.5px}
.leaf .t small{color:var(--soft);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.leaf .sc{font-weight:800;font-size:13px}
.leaf .flags{font-size:13px;letter-spacing:1px;min-width:14px}
.f-w{color:#2d9b6f}.f-l{color:#e0564a}.f-later{color:#c88a1b}
.cloud{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;max-width:1100px;margin:0 auto}
.group-title{font-family:"Patrick Hand";font-size:24px;margin:34px 0 14px;text-align:center;color:var(--soft)}
.empty{text-align:center;color:var(--soft);font-family:"Patrick Hand";font-size:21px;padding:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:-26px 0 30px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--lemon)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple-d)}
.btn.danger{border-color:#c94a3f;color:#c94a3f}
.btn.tiny{padding:3px 10px;font-size:12px}
.in{border:2px solid #e4dccd;border-radius:12px;padding:7px 10px;background:#fff;min-width:0}
.sortsel{border:2px solid #e4dccd;border-radius:999px;padding:5px 10px;background:#fff;font-size:14px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(47,58,54,.35);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:24px;max-width:760px;width:100%;padding:24px 26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-family:"Patrick Hand";font-size:32px;margin:0 40px 2px 0;line-height:1.1}
.modal .en{color:var(--soft);margin:0 0 10px}
.modal .x{position:absolute;right:16px;top:14px;border:none;background:var(--pink);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:#fff;box-shadow:var(--shadow);text-decoration:none;cursor:pointer;border:none}
.sec{background:#fff;border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.sec h3{font-family:"Patrick Hand";font-size:22px;margin:0 0 8px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:14px;background:var(--bg);cursor:pointer;font-weight:700;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--purple-d)}
.check.on{background:var(--mint)}
.links-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.links-grid{grid-template-columns:1fr}}
.watch a{display:block;padding:8px 12px;border-radius:12px;margin:6px 0;text-decoration:none;font-weight:700}
.watch.free a{background:var(--mint)} .watch.paid a{background:var(--peach)}
.watch a:hover{filter:brightness(.95)}
.note{font-size:12px;color:var(--soft)}
textarea.in{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{font-weight:700;font-size:13px;min-width:110px}
.row .in{flex:1}
.linkrow{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin:5px 0}
.topbar .toolbar{margin:0 0 14px}.pager{margin:0 0 26px}.pager .btn{text-decoration:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;display:none;font-weight:700}
.manage{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.manage .sec{margin:0}
.manage ol{padding-left:20px;margin:6px 0}
.manage li{margin:4px 0}
code{background:var(--lav);padding:1px 5px;border-radius:6px;font-size:13px}
.listmgr{display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto 30px}
.listmgr .item{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.listmgr .item .in{flex:1}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.x-chip{border:none;background:rgba(255,255,255,.7);border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;margin-left:4px;cursor:pointer;font-size:12px}
.cgcat summary{cursor:pointer;list-style:none}.cgcat summary::-webkit-details-marker{display:none}.cgcat summary h3::before{content:"▸ ";color:var(--soft)}.cgcat[open] summary h3::before{content:"▾ "}
.surprise{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
.btn.acct{white-space:nowrap}
.mylink{display:flex;gap:6px;align-items:center}.mylink a{flex:1;min-width:0}.erow .btn.tiny{padding:3px 8px}.btn:disabled{opacity:.35;cursor:default}
.addlink{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:6px}
.simrow,.recrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;margin:6px 0;text-decoration:none;background:var(--bg);flex-wrap:wrap}
.simrow:hover,.recrow:hover{background:var(--lav)}
.simrow span,.recrow span{font-size:12px;color:var(--soft)}
.node.center.c-pink{background:var(--pink)}.node.center.c-mint{background:var(--mint)}.node.center.c-lemon{background:var(--lemon)}.node.center.c-peach{background:var(--peach)}.node.center.c-lav{background:var(--lav)}
.fgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.fcard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.fcard h4{font-family:"Patrick Hand";font-size:23px;font-weight:400;margin:0 0 8px}
.fcard .note{margin:8px 0}
footer{text-align:center;color:var(--soft);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <a class="brand" href="#home">Anime Mind Map</a>
  <div class="crumbs" id="crumbs"></div>
  <button class="btn acct" id="acct-btn">👤 Guest</button>
  <div class="search">
    <input id="q" type="search" placeholder="Search anime…" autocomplete="off">
    <div class="results" id="qres"></div>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="acct-ov"><div class="modal" id="acct-modal" style="max-width:460px"></div></div>
<div class="toast" id="toast"></div>

// The owner can publish their current data as the starting point for every guest and account,
// in the browser and the Claude desktop app alike. Stored server-side with the Claude page.
let canonDb=null,canonIsOwner=false,canonMeta=null;
function canonCached(){return lsGet(CANON_KEY)}
function applyCanon(c,quiet){
  const mine=slim(DB);
  if(c)lsSet(CANON_KEY,c);else{try{localStorage.removeItem(CANON_KEY)}catch(e){}}
  setBase(c);DB=prepDB(loadDB(mine));lsSet(dataKey(),slim(DB));
  route(true);if(!quiet)toast(c?"Loaded the latest shared starting data":"Back to the site's built-in data")}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))])}
async function canonInit(){
  if(!(window.claude&&typeof window.claude.use==="function"))return;
  try{const db=await window.claude.use("db");if(!db)return;canonDb=db;
    const user=await window.claude.use("user");canonIsOwner=!!(user&&user.isOwner&&user.isOwner());
    const snap=await withTimeout(db.doc("site/canonical").get(),10000);
    const cached=canonCached();
    if(!snap.exists){canonMeta=null;if(cached)applyCanon(null,true)}
    else{const body=snap.data();canonMeta={stamp:body.stamp,savedAt:body.savedAt};
      if(!cached||cached.stamp!==body.stamp)applyCanon({stamp:body.stamp,data:JSON.parse(body.json)})}
  }catch(e){}
  if(location.hash.slice(1)==="manage")renderCanonSec();
}
function canonData(incTags,incPersonal){
  const D=clone(DB);
  const o={presetApplied:incTags?D.presetApplied:undefined,deleted:D.deleted||[],deletedCG:D.deletedCG||[],globalFree:D.globalFree||[],customLists:incPersonal?D.customLists:[]};
  const pa=idMap(SEED.anime),pcg=idMap(SEED.customGenres);
  o.anime=D.anime.filter(a=>J(a)!==J(pa[a.id]));
  o.franchises={};Object.entries(D.franchises).forEach(([k,f])=>{if(J(f)!==J(SEED.franchises[k]))o.franchises[k]=f});
  o.customGenres=D.customGenres.filter(g=>J(g)!==J(pcg[g.id]));
  o.user={};
  Object.entries(D.user||{}).forEach(([id,u])=>{
    const e={watched:incPersonal?!!u.watched:false,liked:incPersonal?!!u.liked:false,later:incPersonal?!!u.later:false,lists:incPersonal?(u.lists||[]):[],cg:incTags?(u.cg||[]):[],notes:incPersonal?(u.notes||""):"",myFree:incPersonal?(u.myFree||[]):[],myRecs:incPersonal?(u.myRecs||[]):[]};
    if(incTags&&u.sim)e.sim=u.sim;
    if(e.watched||e.liked||e.later||e.lists.length||e.cg.length||e.notes||e.myFree.length||e.myRecs.length||e.sim)o.user[id]=e});
  return o}
function renderCanonSec(){
  const el=$("#canon-sec");if(!el)return;
  if(!canonDb||!canonIsOwner){el.innerHTML="";return}
  const when=canonMeta?new Date(canonMeta.savedAt).toLocaleString():null;
  el.innerHTML=`<div class="sec" style="margin-bottom:18px;border:2px solid var(--purple)"><h3>⭐ Shared starting data for everyone</h3>
    <p class="note">Only you (the owner) see this. Publishing makes the data you're looking at right now${curAcct()?` (account <b>${esc(curAcct())}</b>)`:" (your guest profile)"} the starting point for every guest and new account, in the Claude website and the desktop app. People's own changes stay on top of it.</p>
    <p class="note"><b>Status:</b> ${when?`shared data published ${esc(when)}.`:"nothing published yet — everyone starts from the site's built-in data."}</p>
    <label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cn-tags" checked> Include trope tags and “Similar to” edits</label>
    <label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cn-personal"> Include my checkmarks, custom lists, notes & links (everyone would start with them)</label>
    <p class="note">Always included: edits to anime details, series & seasons, watch links, recommendations, “Connected to” lists, and custom genres / tropes.</p>
    <div class="row"><button class="btn primary" id="cn-pub">${when?"Update the shared data from this browser":"Make this browser's data the shared starting data"}</button>${when?`<button class="btn danger" id="cn-clear">Stop sharing</button>`:""}</div>
    <p class="note" id="cn-msg"></p></div>`;
  $("#cn-pub").onclick=async e=>{const btn=e.target,msg=$("#cn-msg");btn.disabled=true;msg.textContent="Publishing…";

/* ---------- password hashing (PBKDF2-SHA256) ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hashPw(pw,saltHex){
  if(!(window.crypto&&crypto.subtle))throw new Error("Accounts need a secure (https) page");
  const salt=saltHex?new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},key,256);
  return {salt:hex(salt),hash:hex(bits)}}
const normUser=s=>String(s||"").trim().toLowerCase();
function validUser(u){return /^[a-z0-9_.-]{3,20}$/.test(u)}

async function sb(path,opts={},auth){
  const c=cloudCfg();if(!c)throw new Error("Online accounts aren't set up");
  const h={apikey:c.key,"Content-Type":"application/json",...(opts.headers||{})};if(auth)h.Authorization="Bearer "+auth;
  const r=await fetch(c.url.replace(/\/$/,"")+path,{...opts,headers:h});
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status));
  return j}
function setSession(j,name){ACC.session={name,uid:j.user.id,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000};saveAcc()}
async function token(){const s=ACC.session;if(!s)throw new Error("Not signed in online");
  if(Date.now()>s.exp){const j=await sb("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.refresh})});setSession(j,s.name)}
  return ACC.session.access}
async function cloudPull(){const t=await token();const rows=await sb("/rest/v1/mindmap_data?select=data,updated_at&user_id=eq."+ACC.session.uid,{},t);return rows&&rows[0]?rows[0].data:null}
async function cloudPush(){const t=await token();

function isCloud(){const c=curAcct();return !!(c&&ACC.users[c].mode==="cloud"&&ACC.session&&ACC.session.name===c)}
function cloudSaveSoon(){if(!isCloud())return;clearTimeout(cloudTimer);setCloud("saving");cloudTimer=setTimeout(async()=>{try{await cloudPush();setCloud("saved")}catch(e){setCloud("offline")}},1500)}

function similar(a,n=5){const mine=new Set(tagsOf(a));const best={};DB.anime.forEach(b=>{if(b===a||(a.franchise&&b.franchise===a.franchise))return;const bt=tagsOf(b);const shared=bt.filter(x=>mine.has(x));if(!shared.length)return;const s=shared.length/new Set([...mine,...bt]).size;const key=b.franchise||b.id;if(!best[key]||s>best[key].s||(s===best[key].s&&(b.rank??1e9)<(best[key].b.rank??1e9)))best[key]={b,s,shared}});return Object.values(best).sort((x,y)=>y.s-x.s||(x.b.rank??1e9)-(y.b.rank??1e9)).slice(0,n)}

/* ---------- connector drawing ---------- */
function drawLinks(map){
  if(!map)return;
  let svg=map.querySelector(":scope > svg.links");
  if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","links");map.prepend(svg)}
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3a36" stroke="none"/></marker></defs>';
  const mr=map.getBoundingClientRect();
  const fr=[...map.querySelectorAll("[data-firstrow]")].map(e=>e.getBoundingClientRect().top);const frTop=fr.length?Math.min(...fr):0;
  map.querySelectorAll("[data-parent]").forEach(ch=>{
    const p=map.querySelector('[data-node="'+ch.dataset.parent+'"]');
    if(!p||!ch.offsetParent)return;
    if(ch.dataset.firstrow&&ch.getBoundingClientRect().top>frTop+10)return;
    const a=p.getBoundingClientRect(),b=ch.getBoundingClientRect();
    const ac={x:a.left+a.width/2-mr.left,y:a.top+a.height/2-mr.top},bc={x:b.left+b.width/2-mr.left,y:b.top+b.height/2-mr.top};
    const dx=bc.x-ac.x,dy=bc.y-ac.y;let x1,y1,x2,y2,d;
    const vertical=ch.dataset.dir==="v"||(Math.abs(dy)>Math.abs(dx)*0.9 && (b.top>a.bottom||b.bottom<a.top));
    if(vertical){
      const down=dy>0;x1=ac.x+Math.max(-a.width/3,Math.min(a.width/3,dx*.15));y1=down?a.bottom-mr.top+4:a.top-mr.top-4;
      x2=bc.x;y2=down?b.top-mr.top-6:b.bottom-mr.top+6;const m=(y2-y1)/2;
      d=`M${x1},${y1} C${x1},${y1+m} ${x2},${y2-m} ${x2},${y2}`;
    }else{
      const right=dx>0;x1=right?a.right-mr.left+4:a.left-mr.left-4;y1=ac.y+Math.max(-a.height/3,Math.min(a.height/3,dy*.1));
      x2=right?b.left-mr.left-6:b.right-mr.left+6;y2=bc.y;const m=(x2-x1)/2;
      d=`M${x1},${y1} C${x1+m},${y1} ${x2-m},${y2} ${x2},${y2}`;
    }
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",d);path.setAttribute("marker-end","url(#ah)");svg.appendChild(path);
  });
}
function redraw(){document.querySelectorAll("#app .map").forEach(drawLinks)}

let curPage=1,curBase="home";const PAGE=100;
function pager(total){const n=Math.ceil(total/PAGE);if(n<=1)return "";

function rankedTree(rootLabel,rootCls,fullList,opts={}){
  const per=opts.per||10;const tiers=[];
  const pages=Math.max(1,Math.ceil(fullList.length/PAGE));if(curPage>pages)curPage=pages;
  const off=(curPage-1)*PAGE;const list=fullList.slice(off,off+PAGE);
  for(let i=0;i<list.length;i+=per)tiers.push(list.slice(i,i+per));
  const tierCls=["c-pink","c-peach","c-mint","c-lav","c-sky","c-lemon"];
  return `<div class="topbar">${opts.toolbar||""}${pager(fullList.length)}</div><div class="map">
    <div class="root-row"><div class="node center ${rootCls||""}" style="font-size:34px" data-node="root">${esc(rootLabel)}</div></div>
    ${list.length?`<div class="tiers">${tiers.map((t,ti)=>`
      <div class="tier">
        <div class="node big ${tierCls[ti%tierCls.length]}" data-node="t${ti}" data-parent="root" data-firstrow="1">#${off+ti*per+1}–${off+ti*per+t.length}</div>
        <div class="leaves">${t.map((a,i)=>leafHTML(a,(opts.labelFn?opts.labelFn(a,off+ti*per+i):"#"+(off+ti*per+i+1)),"t"+ti)).join("")}</div>
      </div>`).join("")}</div>${pager(fullList.length)}`:`<div class="empty">${opts.empty||"Nothing here yet."}</div>`}
  </div>`;
}
let sortMode="rank";

  const l=[...list];
  if(sortMode==="score")l.sort((a,b)=>(b.score||0)-(a.score||0));

  else l.sort((a,b)=>(a.rank??1e9)-(b.rank??1e9));

}

async function syncMAL(){
  const n=+$("#sync-n").value,msg=$("#sync-msg");const pages=Math.ceil(n/25);const got=[];
  try{
    for(let p=1;p<=pages;p++){
      msg.textContent="Fetching page "+p+" of "+pages+"…";
      const r=await fetch("https://api.jikan.moe/v4/top/anime?page="+p);if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();got.push(...j.data);await new Promise(r=>setTimeout(r,1100));
    }
  }catch(e){msg.textContent="Couldn't reach MyAnimeList ("+e.message+"). If you're viewing inside Claude, host the file first (see the steps on this page).";return}
  const top=got.slice(0,n);const seen=new Set();let added=0;
  top.forEach(x=>{
    const names=a=>(a||[]).map(g=>g.name);
    const fields={rank:x.rank,title:x.title,titleEn:x.title_english||x.title,score:x.score,type:x.type,episodes:x.episodes==null?"?":String(x.episodes),aired:x.aired?.string||"",
      genres:[...names(x.genres),...names(x.explicit_genres)],themes:names(x.themes),demographic:names(x.demographics)[0]||""};
    let a=byId(x.mal_id);seen.add(String(x.mal_id));
    if(a)Object.assign(a,fields,{synced:true});else{DB.anime.push(Object.assign({id:x.mal_id,synced:true},fields,defaultLinks(fields.titleEn)));added++}
  });
  DB.anime.forEach(a=>{if(!seen.has(String(a.id))&&typeof a.id==="number"){a.rank=null;a.synced=true}});
  save();msg.textContent="Done! "+top.length+" ranks updated, "+added+" new anime added. Anime that dropped out keep their page but lose their rank number.";
}

function pickRandom(mode,from){

  else pool=DB.anime.filter(b=>!U2(b.id).watched);
  if(from)pool=pool.filter(b=>b!==from&&!(from.franchise&&b.franchise===from.franchise));
  if(!pool.length){toast({later:"Your Watch later list is empty",trope:"No other unwatched anime share this one's tropes",liked:"Like a few anime first, then try again",genre:"No other unwatched anime in these genres"}[mode]||"Nothing left to pick — you've watched everything!");return null}

  const tagIt=()=>{const v=$("#m-newcg").value.trim();if(!v)return;let g=DB.customGenres.find(x=>x.name.toLowerCase()===v.toLowerCase());
    if(!g){g={id:uid(),name:v,color:CG_COLORS[DB.customGenres.length%CG_COLORS.length]};DB.customGenres.push(g);toast("New trope created & tagged")}else toast("Tagged");
    if(!u.cg.includes(g.id))u.cg.push(g.id);save();openAnime(id)};
  $("#m-addcg").onclick=tagIt;$("#m-newcg").onkeydown=e=>{if(e.key==="Enter")tagIt()};
  $("#m-notes").oninput=e=>{u.notes=e.target.value;save()};
  $("#m-edit").onclick=()=>{editing=true;openAnime(id)};
  $("#m-smode").onchange=e=>{surpriseMode=e.target.value};
  $("#m-surprise").onclick=()=>{const b=pickRandom(surpriseMode,a);if(b){$("#overlay").scrollTop=0;location.hash="anime-"+b.id}};
  }else{
  const lr=(arr,kind)=>{const rows=[...(arr||[])];while(rows.length<4)rows.push({name:"",url:""});return rows.slice(0,4).map((l,i)=>`<div class="linkrow"><input class="in" data-k="${kind}" data-i="${i}" data-f="name" value="${esc(l.name)}" placeholder="Site name"><input class="in" data-k="${kind}" data-i="${i}" data-f="url" value="${esc(l.url)}" placeholder="https://…"><span></span></div>`).join("")};
  m.innerHTML=`<button class="x" id="mx" aria-label="Close">×</button><h2>Edit: ${esc(a.titleEn||a.title)}</h2>
    <div class="sec">
      <div class="row"><label>English title</label><input class="in" id="e-en" value="${esc(a.titleEn)}"></div>
      <div class="row"><label>Japanese title</label><input class="in" id="e-t" value="${esc(a.title)}"></div>
      <div class="row"><label>MAL rank</label><input class="in" id="e-r" type="number" value="${a.rank??""}" style="max-width:90px"><label style="min-width:auto">Score</label><input class="in" id="e-s" type="number" step="0.01" value="${a.score??""}" style="max-width:90px"></div>
      <div class="row"><label>Type</label><input class="in" id="e-ty" value="${esc(a.type)}"><label style="min-width:auto">Episodes</label><input class="in" id="e-ep" value="${esc(a.episodes)}" style="max-width:80px"></div>
      <div class="row"><label>Aired</label><input class="in" id="e-ai" value="${esc(a.aired)}"></div>
      <div class="row"><label>Genres</label><input class="in" id="e-g" value="${esc((a.genres||[]).join(", "))}"></div>
      <div class="row"><label>Themes</label><input class="in" id="e-th" value="${esc((a.themes||[]).join(", "))}"></div>
      <div class="row"><label>Demographic</label><input class="in" id="e-d" value="${esc(a.demographic)}"></div>
      <div class="row"><label>Series</label><select class="in" id="e-fr"><option value="">— none —</option>${Object.entries(DB.franchises).sort((x,y)=>x[1].name.localeCompare(y[1].name)).map(([k,f])=>`<option value="${k}" ${a.franchise===k?"selected":""}>${esc(f.name)}</option>`).join("")}</select></div>
    </div>
    <div class="sec"><h3>Free websites (up to 4)</h3>${lr(a.free,"free")}</div>
    <div class="sec"><h3>Paid websites (up to 4)</h3>${lr(a.paid,"paid")}</div>
    <div class="row"><button class="btn primary" id="e-save">Save changes</button><button class="btn" id="e-cancel">Cancel</button><span style="flex:1"></span><button class="btn danger" id="e-del">Delete this anime</button></div>`;
  $("#e-save").onclick=()=>{
    const sp=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
    Object.assign(a,{titleEn:$("#e-en").value.trim(),title:$("#e-t").value.trim()||a.title,rank:$("#e-r").value===""?null:+$("#e-r").value,score:$("#e-s").value===""?null:+$("#e-s").value,type:$("#e-ty").value.trim(),episodes:$("#e-ep").value.trim(),aired:$("#e-ai").value.trim(),genres:sp($("#e-g").value),themes:sp($("#e-th").value),demographic:$("#e-d").value.trim(),franchise:$("#e-fr").value});
    ["free","paid"].forEach(k=>{const rows=[0,1,2,3].map(i=>({name:m.querySelector(`[data-k="${k}"][data-i="${i}"][data-f="name"]`).value.trim(),url:m.querySelector(`[data-k="${k}"][data-i="${i}"][data-f="url"]`).value.trim()})).filter(l=>l.url);rows.forEach(l=>{if(!/^https?:\/\//i.test(l.url))l.url="https://"+l.url;if(!l.name)l.name=l.url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]});a[k]=rows});
    a.edited=true;save();editing=false;toast("Saved");openAnime(id);route(true);
  };
  $("#e-cancel").onclick=()=>{editing=false;openAnime(id)};
  $("#e-del").onclick=e=>confirmBtn(e.target,()=>{DB.anime=DB.anime.filter(x=>x!==a);delete DB.user[a.id];(DB.deleted=DB.deleted||[]).push(a.id);save();closeModal();toast("Deleted")});
  }
  $("#mx").onclick=closeModal;
  $("#overlay").classList.add("open");
}
function closeModal(){$("#overlay").classList.remove("open");editing=false;if(location.hash.startsWith("#anime-"))location.hash=lastView;else route()}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#overlay").classList.contains("open"))closeModal()});
app.addEventListener("click",e=>{const l=e.target.closest("[data-anime]");if(l){location.hash="anime-"+l.dataset.anime}});

/* ---------- account panel ---------- */
let acctTab="signin";
function acctBtn(){const b=$("#acct-btn");if(!b)return;const c=curAcct();
  b.textContent=c?"👤 "+c+(isCloud()?" ☁"+({saving:"…",syncing:"…",saved:"✓",offline:"!"}[cloudState]||""):""):"👤 Sign in";
  b.title=c?(isCloud()?"Online account — "+(cloudState==="offline"?"couldn't reach the server, will retry on your next change":"synced across devices"):"Account saved on this device"):"Browsing as a guest"}
function closeAcct(){$("#acct-ov").classList.remove("open")}
$("#acct-ov").addEventListener("click",e=>{if(e.target.id==="acct-ov")closeAcct()});
$("#acct-btn").onclick=()=>openAcct();
const failWait=()=>new Promise(r=>setTimeout(r,700));
function openAcct(){
  const m=$("#acct-modal"),c=curAcct(),cfg=cloudCfg(),names=Object.keys(ACC.users).sort();
  if(c){const rec=ACC.users[c],cloud=rec.mode==="cloud";
    m.innerHTML=`<button class="x" id="ax">×</button><h2>Hi, ${esc(c)}</h2>
      <p class="en">${cloud?(isCloud()?"Online account — your checkmarks, lists, notes and edits sync to any device you sign in on.":"Online account — signed out of the server; sign in again to sync."):"Account on this device — your checkmarks, lists, notes and edits are saved for you in this browser."}</p>
      ${cloud&&isCloud()?`<div class="row"><button class="btn" id="a-sync">Sync now</button><span class="note" id="a-syncmsg">${cloudState==="offline"?"Last save didn't reach the server.":""}</span></div>`:""}
      ${!cloud?`<div class="sec"><h3>Change password</h3><input class="in" type="password" id="a-old" placeholder="Current password" style="width:100%;margin:4px 0"><input class="in" type="password" id="a-new" placeholder="New password (6+ characters)" style="width:100%;margin:4px 0"><button class="btn tiny" id="a-chpw">Change password</button></div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="a-out">Sign out</button><span style="flex:1"></span>${!cloud?`<button class="btn danger" id="a-del">Delete account…</button>`:""}</div>
      <p class="note" id="a-msg"></p>`;
    $("#a-out").onclick=async()=>{if(isCloud()){clearTimeout(cloudTimer);try{await cloudPush()}catch(e){}ACC.session=null}switchTo(null);closeAcct();toast("Signed out — browsing as guest")};
    const sy=$("#a-sync");if(sy)sy.onclick=async()=>{$("#a-syncmsg").textContent="Syncing…";try{await cloudPush();setCloud("saved");$("#a-syncmsg").textContent="Saved to your online account ✓"}catch(e){setCloud("offline");$("#a-syncmsg").textContent="Couldn't reach the server: "+e.message}};
    const ch=$("#a-chpw");if(ch)ch.onclick=async()=>{const msg=$("#a-msg");try{const h=await hashPw($("#a-old").value,rec.salt);if(h.hash!==rec.hash){await failWait();msg.textContent="Current password is wrong.";return}
      const np=$("#a-new").value;if(np.length<6){msg.textContent="New password needs at least 6 characters.";return}const nh=await hashPw(np);rec.salt=nh.salt;rec.hash=nh.hash;saveAcc();msg.textContent="Password changed ✓"}catch(e){msg.textContent=e.message}};
    const dl=$("#a-del");if(dl)dl.onclick=()=>{m.querySelector("#a-msg").innerHTML=`Type your password to permanently delete <b>${esc(c)}</b> and its data from this device: <input class="in" type="password" id="a-delpw" style="width:100%;margin:6px 0"><button class="btn danger tiny" id="a-delgo">Delete forever</button>`;
      $("#a-delgo").onclick=async()=>{const h=await hashPw($("#a-delpw").value,rec.salt);if(h.hash!==rec.hash){await failWait();toast("Wrong password");return}
        try{localStorage.removeItem("animeMindMap.acct."+c)}catch(e){}delete ACC.users[c];switchTo(null);closeAcct();toast("Account deleted")}};
  }else{
    const create=acctTab==="create";
    m.innerHTML=`<button class="x" id="ax">×</button><h2>${create?"Create an account":"Sign in"}</h2>
      <p class="en">Each account keeps its own checkmarks, lists, notes, tropes and edits.</p>
      <div class="row"><button class="btn ${!create?"primary":""}" id="a-tab-in">Sign in</button><button class="btn ${create?"primary":""}" id="a-tab-new">Create account</button></div>
      <form id="a-form" class="sec" autocomplete="on">
        <div class="row"><label>Username</label><input class="in" id="a-user" autocomplete="username" placeholder="3–20 letters, numbers, . _ -" required></div>
        <div class="row"><label>Password</label><input class="in" type="password" id="a-pw" autocomplete="${create?"new-password":"current-password"}" required></div>
        ${create?`<div class="row"><label>Confirm</label><input class="in" type="password" id="a-pw2" autocomplete="new-password" required></div>
          ${cfg?`<div class="row"><label>Where to save</label><select class="in" id="a-mode"><option value="cloud">Online — sign in from any device</option><option value="local">This device only</option></select></div>`:`<p class="note">Saved on this device. (To sign in from any device, set up Online accounts on the Manage page.)</p>`}
          <label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="a-carry" checked> Start with what I've done so far as a guest</label>`:""}
        <div class="row" style="margin-top:10px"><button class="btn primary" type="submit" id="a-go">${create?"Create account":"Sign in"}</button></div>
        <p class="note" id="a-msg"></p>
      </form>
      ${names.length?`<p class="note">Accounts on this device: ${names.map(n=>`<button class="chip" data-pick="${esc(n)}">${esc(n)}${ACC.users[n].mode==="cloud"?" ☁":""}</button>`).join(" ")}</p>`:""}
      <p class="note">Passwords are never stored — only a salted PBKDF2 hash. Device-only accounts keep people's data separate on a shared computer, but they aren't bank-level security.</p>`;
    $("#a-tab-in").onclick=()=>{acctTab="signin";openAcct()};$("#a-tab-new").onclick=()=>{acctTab="create";openAcct()};
    m.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{acctTab="signin";openAcct();$("#a-user").value=b.dataset.pick;$("#a-pw").focus()});
    $("#a-form").onsubmit=async e=>{e.preventDefault();const msg=$("#a-msg"),go=$("#a-go");const u=normUser($("#a-user").value),pw=$("#a-pw").value;
      if(!validUser(u)){msg.textContent="Usernames are 3–20 characters: letters, numbers, dots, dashes or underscores.";return}
      go.disabled=true;msg.textContent=create?"Creating…":"Signing in…";
      try{
        if(create){
          if(pw.length<6)throw new Error("Passwords need at least 6 characters.");
          if(pw!==$("#a-pw2").value)throw new Error("The passwords don't match.");
          if(ACC.users[u])throw new Error("That username is already used on this device.");
          const mode=cfg&&$("#a-mode")?$("#a-mode").value:"local",start=$("#a-carry").checked?slim(DB):null;
          if(mode==="cloud"){const j=await sb("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:cloudEmail(u),password:pw,data:{username:u}})});
            if(!j||!j.access_token)throw new Error("The account was made but needs email confirmation — turn off “Confirm email” in Supabase (see Manage page).");
            ACC.users[u]={mode:"cloud",created:Date.now()};setSession(j,u);switchTo(u,start);await cloudPush();setCloud("saved")}
          else{const h=await hashPw(pw);ACC.users[u]={mode:"local",salt:h.salt,hash:h.hash,created:Date.now()};switchTo(u,start)}
          closeAcct();toast("Welcome, "+u+"!")
        }else{
          const rec=ACC.users[u];
          if(rec&&rec.mode==="local"){const h=await hashPw(pw,rec.salt);if(h.hash!==rec.hash){await failWait();throw new Error("Wrong username or password.")}switchTo(u)}
          else if(cfg){let j;try{j=await sb("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:cloudEmail(u),password:pw})})}catch(err){await failWait();throw new Error(/invalid/i.test(err.message)?"Wrong username or password.":"Couldn't reach the online account server: "+err.message)}
            ACC.users[u]=Object.assign(ACC.users[u]||{created:Date.now()},{mode:"cloud"});setSession(j,u);const r=await cloudPull();switchTo(u,r||undefined);if(!r)await cloudPush();setCloud("saved")}
          else{await failWait();throw new Error("No account with that username on this device.")}
          closeAcct();toast("Signed in as "+u)
        }
      }catch(err){msg.textContent=err.message;go.disabled=false}};
  }
  $("#ax").onclick=closeAcct;$("#acct-ov").classList.add("open");
}

/* ---------- search ---------- */
const q=$("#q"),qres=$("#qres");
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();if(!s){qres.style.display="none";return}
  const hits=ranked().filter(a=>(a.title+" "+a.titleEn+" "+tagsOf(a).join(" ")).toLowerCase().includes(s)).slice(0,12);
  qres.innerHTML=hits.map(a=>`<div data-go="${a.id}"><b>#${a.rank??"–"}</b> ${esc(a.titleEn||a.title)}</div>`).join("")||'<div>No matches</div>';qres.style.display="block";
});
qres.addEventListener("click",e=>{const d=e.target.closest("[data-go]");if(d){location.hash="anime-"+d.dataset.go;q.value="";qres.style.display="none"}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))qres.style.display="none"});

/* ---------- router ---------- */
let lastView="home";
function route(keepModal){
  const h=(location.hash||"#home").slice(1);
  if(h.startsWith("random")){
    // pick once, then swap the URL to the anime so closing returns to the page you came from (no re-roll loop)
    const a=pickRandom(h==="random-later"?"later":"unwatched");
    if(!a){location.replace("#"+lastView);return}
    location.replace("#anime-"+a.id);return;
  }
  if(h.startsWith("anime-")){ if(!app.innerHTML)render(lastView); openAnime(h.slice(6)); return; }
  if(!keepModal)$("#overlay").classList.remove("open");
  lastView=h;render(h);
}
function render(h){
  const pm=h.match(/^(.*)-p(\d+)$/);curPage=pm?Math.max(1,+pm[2]):1;if(pm)h=pm[1];curBase=h;
  if(h==="top")topView();
  else if(h==="genres")genresView();
  else if(h.startsWith("genre-"))tagView("genres",h.slice(6),"Genres");
  else if(h.startsWith("theme-"))tagView("themes",h.slice(6),"Themes");
  else if(h.startsWith("demo-"))tagView("demographic",h.slice(5),"Demographics");
  else if(h==="lists")listsView();
  else if(h.startsWith("list-")&&STATUS[h.slice(5)])statusView(h.slice(5));
  else if(h.startsWith("cl-"))customListView(h.slice(3));
  else if(h==="custom")customGenresView();
  else if(h.startsWith("cg-"))cgView(h.slice(3));
  else if(h==="manage")manageView();
  else if(h==="seasons")seasonsView();
  else homeView();
  $("#foot").textContent="Rankings from MyAnimeList · "+DB.anime.length+" anime · "+(curAcct()?(isCloud()?"signed in as "+curAcct()+" (online)":"signed in as "+curAcct()+" (this device)"):"browsing as a guest — sign in to keep your own lists");
  requestAnimationFrame(redraw);
}
const ORIGIN_SNAPSHOT=document.documentElement.cloneNode(true);
ORIGIN_SNAPSHOT.querySelector("#app").innerHTML="";ORIGIN_SNAPSHOT.querySelector("#foot").innerHTML="";
const ORIGINAL_HTML=ORIGIN_SNAPSHOT.outerHTML;
window.addEventListener("hashchange",()=>route());
route();acctBtn();cloudSyncOnLoad();canonInit();
})();
</script>
